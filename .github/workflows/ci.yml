name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-and-imports:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install minimal dependencies
      run: |
        python -m pip install --upgrade pip
        pip install biopython pandas numpy
        pip install rdkit || pip install rdkit-pypi || true

    - name: Check Python syntax
      run: |
        python -m py_compile scripts/prepare_receptor.py
        python -m py_compile scripts/prepare_ligand.py
        python -m py_compile scripts/run_docking.py
        python -m py_compile scripts/analyze_results.py
        python -m py_compile scripts/batch_screen.py
        python -m py_compile scripts/calculate_rmsd.py
        python -m py_compile scripts/check_vina.py
        python -m py_compile scripts/predict_pocket.py
        python -m py_compile scripts/utils.py
        echo "All scripts have valid syntax"

    - name: Test analyze_results import
      run: |
        cd scripts
        python -c "import analyze_results; print('ok')"

    - name: Check example library can be read
      run: |
        python -c "
        from pathlib import Path
        lines = Path('data/ligands/example_library.smi').read_text().strip().splitlines()
        ligands = [l for l in lines if l and not l.startswith('#')]
        print(f'Example library contains {len(ligands)} ligands')
        assert len(ligands) >= 5
        "
