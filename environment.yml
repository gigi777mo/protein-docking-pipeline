name: docking
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - biopython
  - openbabel
  - rdkit
  # AutoDock Vina binary (command-line `vina`)
  - autodock-vina
  - pip:
      # Official Python bindings (optional; scripts also call the vina binary)
      - vina
